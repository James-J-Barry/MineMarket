pluginManagement {
    repositories {
        maven { name = "Fabric"; url = "https://maven.fabricmc.net/" }
        gradlePluginPortal()
        mavenCentral()
    }
    plugins {
        id "net.fabricmc.fabric-loom" version "${loom_version}"
    }
}

rootProject.name = "realistic-markets"

include "exchange-core", "sim", "mod"
