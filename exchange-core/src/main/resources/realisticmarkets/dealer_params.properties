# Realistic Markets: Dealer tuning (design doc, "Economy balance").
# Edit the copy in config/realisticmarkets/ and run /mkt dealer reload to apply without restarting.

# Total bid/ask spread at the Basic Exchange (0.20 = 20%) and with a Merchant License
spread=0.20
licensed_spread=0.12

# Price impact steepness: mid = V * exp(-k * inventory / depth)
k=1.0

# Days for the Dealer's inventory to decay by a factor of e (price recovery speed)
recovery_days=2.0

# How fair value moves (M5c): a daily random shock, trends that persist, a very weak pull back toward the
# catalog value over months, and a permanent effect from what players sell (-) or buy (+), per depth's worth.
drift_sigma=0.02
trend_sigma=0.0025
trend_half_life_days=7.0
anchor_half_life_days=60.0
supply_impact=0.01
